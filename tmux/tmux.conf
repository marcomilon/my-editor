set -g mouse on
set -g history-limit 10000
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

set -g status-interval 5
set -g status-style bg=blue,fg=white
set -g status-left-length 40
set -g status-right-length 80

# Prefix badge + session name
set -g status-left '#{?client_prefix,#[bg=yellow fg=black bold] PREFIX #[default] ,}#[bold]#S#[default] | '

# Highlight the current window
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '
setw -g window-status-current-style bg=white,fg=blue,bold

# Current folder + git branch of the active pane
set -g status-right '#{b:pane_current_path} #(cd "#{pane_current_path}" && git branch --show-current 2>/dev/null) '

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

setw -g mode-keys vi
set -g set-clipboard on
bind -n MouseDrag1Pane copy-mode -M
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel "pbcopy"
bind Escape copy-mode
